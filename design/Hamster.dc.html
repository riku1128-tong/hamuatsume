<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>はむパーツ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0;background:transparent}
</style>
</helmet>
<div style="width: {{px}}; height: {{px}}; display: flex; align-items: center; justify-content: center;">

  <!-- おすわり（正面） -->
  <sc-if value="{{isFront}}" hint-placeholder-val="{{true}}">
    <svg viewBox="0 0 100 100" width="100%" height="100%" style="overflow: visible;" stroke-linejoin="round" stroke-linecap="round">
      <g transform="{{flip}}">
        <circle cx="27" cy="31" r="10" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2.2"></circle><circle cx="73" cy="31" r="10" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2.2"></circle>
        <circle cx="27" cy="31" r="4.5" fill="{{c.ear}}"></circle><circle cx="73" cy="31" r="4.5" fill="{{c.ear}}"></circle>
        <path d="M50 22 C22 22 12 50 14 70 C16 92 84 92 86 70 C88 50 78 22 50 22 Z" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2.2"></path>
        <path d="M45 24 Q50 21 55 24 L53 46 L47 46 Z" fill="{{c.stripe}}"></path>
        <ellipse cx="50" cy="75" rx="22" ry="14" fill="{{c.belly}}"></ellipse>
        <circle cx="37" cy="47" r="5.5" fill="{{c.brow}}"></circle><circle cx="63" cy="47" r="5.5" fill="{{c.brow}}"></circle>
        <circle cx="38" cy="50" r="3" fill="{{c.eye}}"></circle><circle cx="62" cy="50" r="3" fill="{{c.eye}}"></circle>
        <ellipse cx="50" cy="58" rx="2.6" ry="2" fill="{{c.nose}}"></ellipse>
        <path d="M46 61 Q48 64 50 61 Q52 64 54 61" stroke="{{c.line}}" stroke-width="1.6" fill="none"></path>
        <path d="M30 58 L22 56 M30 61 L22 63 M70 58 L78 56 M70 61 L78 63" stroke="{{c.line}}" stroke-width="1.2"></path>
        <ellipse cx="40" cy="84" rx="7" ry="4" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2"></ellipse><ellipse cx="60" cy="84" rx="7" ry="4" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2"></ellipse>
        <ellipse cx="27" cy="89" rx="8" ry="4" fill="{{c.belly}}" stroke="{{c.line}}" stroke-width="2"></ellipse><ellipse cx="73" cy="89" rx="8" ry="4" fill="{{c.belly}}" stroke="{{c.line}}" stroke-width="2"></ellipse>
      </g>
    </svg>
  </sc-if>

  <!-- よこむき（あるく） -->
  <sc-if value="{{isSide}}" hint-placeholder-val="{{false}}">
    <svg viewBox="0 0 100 100" width="100%" height="100%" style="overflow: visible;" stroke-linejoin="round" stroke-linecap="round">
      <g transform="{{flip}}">
        <circle cx="66" cy="32" r="9" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2.2"></circle><circle cx="66" cy="32" r="4" fill="{{c.ear}}"></circle>
        <path d="M18 62 C14 40 34 30 56 32 C76 34 90 44 88 62 C86 80 70 88 50 88 C30 88 20 80 18 62 Z" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2.2"></path>
        <path d="M26 44 Q50 32 70 38" stroke="{{c.stripe}}" stroke-width="5" fill="none"></path>
        <ellipse cx="46" cy="77" rx="22" ry="7" fill="{{c.belly}}"></ellipse>
        <circle cx="72" cy="47" r="5.5" fill="{{c.brow}}"></circle>
        <circle cx="73" cy="50" r="3" fill="{{c.eye}}"></circle>
        <circle cx="88" cy="58" r="2.6" fill="{{c.nose}}"></circle>
        <path d="M84 62 L78 66 M86 66 L80 70" stroke="{{c.line}}" stroke-width="1.2"></path>
        <circle cx="17" cy="67" r="3.5" fill="{{c.belly}}" stroke="{{c.line}}" stroke-width="2"></circle>
        <ellipse cx="34" cy="88" rx="8" ry="4" fill="{{c.belly}}" stroke="{{c.line}}" stroke-width="2"></ellipse><ellipse cx="64" cy="88" rx="8" ry="4" fill="{{c.belly}}" stroke="{{c.line}}" stroke-width="2"></ellipse>
      </g>
    </svg>
  </sc-if>

  <!-- うしろすがた -->
  <sc-if value="{{isBack}}" hint-placeholder-val="{{false}}">
    <svg viewBox="0 0 100 100" width="100%" height="100%" style="overflow: visible;" stroke-linejoin="round" stroke-linecap="round">
      <g transform="{{flip}}">
        <circle cx="29" cy="30" r="10" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2.2"></circle><circle cx="71" cy="30" r="10" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2.2"></circle>
        <path d="M50 22 C20 22 12 50 14 70 C16 92 84 92 86 70 C88 50 80 22 50 22 Z" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2.2"></path>
        <path d="M46 25 Q50 22 54 25 L56 80 Q50 84 44 80 Z" fill="{{c.stripe}}"></path>
        <circle cx="50" cy="90" r="4" fill="{{c.belly}}" stroke="{{c.line}}" stroke-width="2"></circle>
        <ellipse cx="29" cy="90" rx="8" ry="4" fill="{{c.belly}}" stroke="{{c.line}}" stroke-width="2"></ellipse><ellipse cx="71" cy="90" rx="8" ry="4" fill="{{c.belly}}" stroke="{{c.line}}" stroke-width="2"></ellipse>
      </g>
    </svg>
  </sc-if>

  <!-- まるくなってねる -->
  <sc-if value="{{isSleep}}" hint-placeholder-val="{{false}}">
    <svg viewBox="0 0 100 100" width="100%" height="100%" style="overflow: visible;" stroke-linejoin="round" stroke-linecap="round">
      <g transform="{{flip}}">
        <circle cx="30" cy="42" r="9" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2.2"></circle><circle cx="30" cy="42" r="4" fill="{{c.ear}}"></circle>
        <circle cx="50" cy="60" r="34" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2.2"></circle>
        <path d="M26 38 Q50 22 76 40" stroke="{{c.stripe}}" stroke-width="5" fill="none"></path>
        <ellipse cx="60" cy="74" rx="18" ry="10" fill="{{c.belly}}"></ellipse>
        <circle cx="38" cy="58" r="5.5" fill="{{c.brow}}"></circle>
        <path d="M34 60 Q39 64 44 60" stroke="{{c.line}}" stroke-width="2" fill="none"></path>
        <circle cx="21" cy="70" r="2.6" fill="{{c.nose}}"></circle>
        <circle cx="82" cy="80" r="3.5" fill="{{c.belly}}" stroke="{{c.line}}" stroke-width="2"></circle>
        <text x="80" y="30" font-size="14" font-weight="700" fill="{{c.line}}" font-family="sans-serif">z</text><text x="88" y="18" font-size="10" font-weight="700" fill="{{c.line}}" font-family="sans-serif">z</text>
      </g>
    </svg>
  </sc-if>

  <!-- うえから（たべてる） -->
  <sc-if value="{{isEat}}" hint-placeholder-val="{{false}}">
    <svg viewBox="0 0 100 100" width="100%" height="100%" style="overflow: visible;" stroke-linejoin="round" stroke-linecap="round">
      <g transform="{{flip}}">
        <circle cx="31" cy="23" r="9" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2.2"></circle><circle cx="69" cy="23" r="9" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2.2"></circle>
        <circle cx="31" cy="23" r="4" fill="{{c.ear}}"></circle><circle cx="69" cy="23" r="4" fill="{{c.ear}}"></circle>
        <path d="M50 16 C30 16 26 32 26 42 C18 48 16 78 26 88 C34 96 66 96 74 88 C84 78 82 48 74 42 C74 32 70 16 50 16 Z" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2.2"></path>
        <path d="M47 18 Q50 15 53 18 L55 86 Q50 89 45 86 Z" fill="{{c.stripe}}"></path>
        <circle cx="35" cy="34" r="5.5" fill="{{c.brow}}"></circle><circle cx="65" cy="34" r="5.5" fill="{{c.brow}}"></circle>
        <circle cx="34" cy="37" r="3" fill="{{c.eye}}"></circle><circle cx="66" cy="37" r="3" fill="{{c.eye}}"></circle>
        <ellipse cx="50" cy="20" rx="3" ry="2.2" fill="{{c.nose}}"></ellipse>
        <ellipse cx="50" cy="50" rx="5" ry="10" fill="#6b4a2a" stroke="{{c.line}}" stroke-width="1.6"></ellipse>
        <circle cx="43" cy="52" r="5" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2"></circle><circle cx="57" cy="52" r="5" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2"></circle>
        <ellipse cx="36" cy="92" rx="7" ry="4" fill="{{c.belly}}" stroke="{{c.line}}" stroke-width="2"></ellipse><ellipse cx="64" cy="92" rx="7" ry="4" fill="{{c.belly}}" stroke="{{c.line}}" stroke-width="2"></ellipse>
      </g>
    </svg>
  </sc-if>

  <!-- あおむけ（ごろん） -->
  <sc-if value="{{isBelly}}" hint-placeholder-val="{{false}}">
    <svg viewBox="0 0 100 100" width="100%" height="100%" style="overflow: visible;" stroke-linejoin="round" stroke-linecap="round">
      <g transform="{{flip}}">
        <circle cx="18" cy="42" r="9" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2.2"></circle><circle cx="18" cy="42" r="4" fill="{{c.ear}}"></circle>
        <circle cx="18" cy="70" r="9" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2.2"></circle><circle cx="18" cy="70" r="4" fill="{{c.ear}}"></circle>
        <path d="M14 56 C14 36 40 30 60 34 C80 38 92 48 90 60 C88 74 76 84 58 84 C40 84 14 78 14 56 Z" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2.2"></path>
        <ellipse cx="60" cy="58" rx="24" ry="16" fill="{{c.belly}}"></ellipse>
        <circle cx="31" cy="50" r="5.5" fill="{{c.brow}}"></circle><circle cx="31" cy="64" r="5.5" fill="{{c.brow}}"></circle>
        <circle cx="30" cy="51" r="3" fill="{{c.eye}}"></circle><circle cx="30" cy="63" r="3" fill="{{c.eye}}"></circle>
        <circle cx="21" cy="57" r="2.4" fill="{{c.nose}}"></circle>
        <ellipse cx="46" cy="44" rx="6" ry="4" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2"></ellipse><ellipse cx="46" cy="72" rx="6" ry="4" fill="{{c.body}}" stroke="{{c.line}}" stroke-width="2"></ellipse>
        <ellipse cx="78" cy="44" rx="8" ry="4" fill="{{c.belly}}" stroke="{{c.line}}" stroke-width="2"></ellipse><ellipse cx="78" cy="74" rx="8" ry="4" fill="{{c.belly}}" stroke="{{c.line}}" stroke-width="2"></ellipse>
        <circle cx="91" cy="60" r="3.5" fill="{{c.belly}}" stroke="{{c.line}}" stroke-width="2"></circle>
      </g>
    </svg>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"item":{"editor":null},"size":{"editor":"int","default":100,"min":40,"max":300,"unit":"px"},"$preview":{"width":100,"height":100}}'>
class Component extends DCLogic {
  renderVals() {
    const it = this.props.item || {};
    const size = this.props.size ?? 100;
    const pose = it.pose || 'front';
    const c = Object.assign({
      body: '#e0a565', belly: '#fff5e6', ear: '#f3c1b0', stripe: 'none', brow: 'none',
      eye: '#2b2320', nose: '#d98b8b', line: '#4a3b2f'
    }, it.colors || {});
    return {
      px: size + 'px',
      c,
      flip: it.flip ? 'translate(100 0) scale(-1 1)' : '',
      isFront: pose === 'front', isSide: pose === 'side', isBack: pose === 'back',
      isSleep: pose === 'sleep', isEat: pose === 'eat', isBelly: pose === 'belly'
    };
  }
}
</script>
</body>
</html>
