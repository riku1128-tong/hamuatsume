<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>はむ詳細</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
body{margin:0;font-family:"Zen Maru Gothic","Hiragino Maru Gothic ProN",sans-serif;background:#fbf3e4;color:#4a3b2f}
a{color:#c9672a}a:hover{color:#a34f1a}
</style>
</helmet>
<div style="width: 480px; height: 680px; box-sizing: border-box; background: #fff8ea; border: 4px solid #d9a35a; border-radius: 28px; padding: 24px; display: flex; flex-direction: column; gap: 14px; color: #4a3b2f; position: relative;">
  <button type="button" aria-label="とじる" style="position: absolute; right: 16px; top: 16px; width: 40px; height: 40px; border-radius: 999px; border: 2px solid #d9a35a; background: #fbf3e4; cursor: pointer; display: flex; align-items: center; justify-content: center;">
    <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="#7a4a1e" stroke-width="2.5" stroke-linecap="round"><path d="M6 6 L18 18 M18 6 L6 18"></path></svg>
  </button>
  <div style="display: flex; align-items: center; gap: 8px;">
    <div style="font-size: 12px; font-weight: 700; color: #a5804f;">No.07</div>
    <div style="font-size: 13px; font-weight: 700; color: #ffffff; background: #7fa65a; border-radius: 999px; padding: 2px 10px;">ジャンガリアン</div>
  </div>
  <div style="display: flex; align-items: center; gap: 20px;">
    <div style="width: 180px; height: 180px; background: #f6e7c8; border-radius: 24px; display: flex; align-items: center; justify-content: center;">
      <dc-import name="Hamster" item="{{hamu}}" size="{{size}}" hint-size="150px,150px"></dc-import>
    </div>
    <div style="display: flex; flex-direction: column; gap: 6px;">
      <div style="font-size: 12px; font-weight: 700; color: #a5804f;">なまえ（へんこうできます）</div>
      <div style="display: flex; align-items: center; gap: 8px;">
        <div style="font-size: 26px; font-weight: 900; color: #7a4a1e;">プディングジャンガリアン</div>
        <button type="button" aria-label="なまえをへんこう" style="width: 32px; height: 32px; border-radius: 999px; border: 2px solid #d9a35a; background: #fbf3e4; cursor: pointer; display: flex; align-items: center; justify-content: center;">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#7a4a1e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20 L8 19 L19 8 L16 5 L5 16 Z"></path></svg>
        </button>
      </div>
      <div style="font-size: 14px; font-weight: 700;">ジャンガリアンハムスター・プディング</div>
      <div style="display: flex; gap: 3px; align-items: center;">
        <span style="font-size: 12px; color: #a5804f; margin-right: 4px;">レア度</span>
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3 L14.5 9 L21 9.5 L16 13.5 L17.5 20 L12 16.5 L6.5 20 L8 13.5 L3 9.5 L9.5 9 Z" fill="#f2c14e"></path></svg>
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3 L14.5 9 L21 9.5 L16 13.5 L17.5 20 L12 16.5 L6.5 20 L8 13.5 L3 9.5 L9.5 9 Z" fill="#f2c14e"></path></svg>
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M12 3 L14.5 9 L21 9.5 L16 13.5 L17.5 20 L12 16.5 L6.5 20 L8 13.5 L3 9.5 L9.5 9 Z" fill="#e6d6b4"></path></svg>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px;">
    <div style="background: #fbf3e4; border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px;"><div style="font-size: 11px; color: #a5804f; font-weight: 700;">せいかく</div><div style="font-size: 16px; font-weight: 700;">おっとり</div></div>
    <div style="background: #fbf3e4; border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px;"><div style="font-size: 11px; color: #a5804f; font-weight: 700;">なかよし度</div><div style="font-size: 16px; font-weight: 700;">Lv.4</div></div>
    <div style="background: #fbf3e4; border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px;"><div style="font-size: 11px; color: #a5804f; font-weight: 700;">きた回数</div><div style="font-size: 16px; font-weight: 700;">14 回</div></div>
    <div style="background: #fbf3e4; border-radius: 14px; padding: 10px 14px; display: flex; flex-direction: column; gap: 2px;"><div style="font-size: 11px; color: #a5804f; font-weight: 700;">はじめて来た日</div><div style="font-size: 16px; font-weight: 700;">2026/09/12</div></div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 12px; font-weight: 700; color: #a5804f;">すきなもの</div>
    <div style="display: flex; gap: 8px; flex-wrap: wrap;">
      <span style="font-size: 13px; font-weight: 700; background: #fde7cf; color: #c9672a; border-radius: 999px; padding: 4px 12px;">ひまわりの種</span>
      <span style="font-size: 13px; font-weight: 700; background: #e6f0d8; color: #5c7f3a; border-radius: 999px; padding: 4px 12px;">トンネル</span>
      <span style="font-size: 13px; font-weight: 700; background: #e3eef5; color: #4b7a99; border-radius: 999px; padding: 4px 12px;">砂場</span>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 6px;">
    <div style="font-size: 12px; font-weight: 700; color: #a5804f;">もらった おみやげ</div>
    <div style="display: flex; gap: 10px;">
      <div style="display: flex; align-items: center; gap: 6px; background: #fbf3e4; border-radius: 12px; padding: 6px 10px; font-size: 13px; font-weight: 700;">
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 2 C16 6 17 12 12 22 C7 12 8 6 12 2Z" fill="#f2c14e" stroke="#b8860b" stroke-width="1.2"></path></svg>金の種 ×2
      </div>
      <div style="display: flex; align-items: center; gap: 6px; background: #fbf3e4; border-radius: 12px; padding: 6px 10px; font-size: 13px; font-weight: 700;">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="#7a4a1e" stroke-width="2"><circle cx="12" cy="12" r="8"></circle><path d="M8 12 L11 15 L16 9"></path></svg>どんぐり
      </div>
    </div>
  </div>

  <div style="flex-grow: 1;"></div>
  <a href="Zukan.dc.html" style="display: flex; align-items: center; justify-content: center; height: 48px; border-radius: 999px; background: #e0803f; color: #ffffff; font-size: 16px; font-weight: 900; text-decoration: none;">図鑑にもどる</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":480,"height":680}}'>
class Component extends DCLogic {
  renderVals() { return { size: 150, hamu: { pose: 'belly', colors: { body: '#e8c27a', belly: '#fff8ea', stripe: '#c49a4c' } } }; }
}
</script>
</body>
</html>
